<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>薩摩耶課堂隨機點名</title>
  <meta name="description" content="活潑可愛的薩摩耶課堂隨機點名工具">
  <style>
    :root { --ink:#17455d; --teal:#0f9da8; --mint:#dff8ef; --cream:#fffaf0; --peach:#ffb675; --orange:#ff7a45; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; background:linear-gradient(160deg,#dff9fb 0%,#fff8e8 55%,#e8fbf2 100%); }
    button,input { font:inherit; }
    .wrap { width:min(1050px,92vw); margin:0 auto; padding:28px 0 44px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:20px; }
    h1 { margin:0; font-size:clamp(1.55rem,4vw,2.35rem); letter-spacing:.04em; }
    .subtitle { margin:5px 0 0; color:#4d7180; font-size:.95rem; }
    .dog { width:84px; height:70px; position:relative; flex:0 0 auto; }
    .dog .face { position:absolute; inset:11px 8px 0; background:#fff; border:3px solid var(--ink); border-radius:45% 45% 48% 48%; box-shadow:0 4px 0 rgba(23,69,93,.08); }
    .dog .ear { position:absolute; top:0; width:32px; height:37px; background:#fff; border:3px solid var(--ink); border-bottom:0; border-radius:90% 15% 20% 20%; z-index:2; }
    .dog .ear.left { left:9px; transform:rotate(-25deg); } .dog .ear.right { right:9px; transform:scaleX(-1) rotate(-25deg); }
    .dog .eye { position:absolute; top:35px; width:7px; height:9px; background:var(--ink); border-radius:50%; z-index:3; } .dog .eye.left { left:29px; } .dog .eye.right { right:29px; }
    .dog .nose { position:absolute; top:45px; left:38px; width:10px; height:7px; border-radius:50%; background:var(--ink); z-index:3; }
    .dog .tongue { position:absolute; width:12px; height:12px; top:51px; left:37px; background:#ff9caf; border-radius:0 0 8px 8px; z-index:2; }
    .card { background:rgba(255,255,255,.86); border:2px solid rgba(15,157,168,.22); border-radius:26px; box-shadow:0 12px 30px rgba(27,98,109,.12); }
    .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:14px; }
    .mode { min-height:100px; text-align:left; padding:15px 16px; color:var(--ink); border:2px solid transparent; border-radius:19px; background:#eefbfb; cursor:pointer; transition:.18s transform,.18s background,.18s border; }
    .mode:hover { transform:translateY(-2px); border-color:#86d9d6; } .mode.active { background:var(--teal); color:#fff; border-color:var(--teal); box-shadow:0 6px 14px rgba(15,157,168,.25); }
    .mode strong { display:block; font-size:1.08rem; margin-bottom:5px; }.mode small { line-height:1.45; opacity:.9; }
    .controls { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; padding:18px 10px 6px; }
    .amount { display:flex; align-items:center; gap:8px; background:#fff6df; padding:9px 13px; border-radius:14px; font-weight:700; }
    .amount input { width:62px; border:2px solid #f1c976; border-radius:9px; padding:5px; color:var(--ink); text-align:center; background:#fff; }
    .draw { border:0; border-radius:99px; padding:13px 28px; color:white; font-weight:800; font-size:1.08rem; cursor:pointer; background:linear-gradient(135deg,#ff955b,#ff7045); box-shadow:0 7px 0 #d95833,0 11px 20px rgba(255,112,69,.24); transition:.15s transform,.15s box-shadow; }
    .draw:hover { transform:translateY(-2px); box-shadow:0 9px 0 #d95833,0 13px 22px rgba(255,112,69,.24); }.draw:active { transform:translateY(5px); box-shadow:0 2px 0 #d95833; }
    .stage { min-height:282px; display:grid; place-items:center; margin-top:20px; padding:30px; overflow:hidden; position:relative; text-align:center; }
    .stage:before,.stage:after { content:"✦"; position:absolute; color:#ffd16f; font-size:2rem; }.stage:before { top:23px; left:35px; }.stage:after { bottom:20px; right:35px; color:#78cfba; }
    .empty { color:#6d8a96; font-size:1.08rem; }.empty span { display:block; font-size:3.5rem; margin-bottom:8px; }
    .result-label { color:#0e949d; font-weight:800; letter-spacing:.14em; }.result-list { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:15px; }
    .winner { min-width:158px; padding:16px 20px; background:linear-gradient(135deg,#fff7d8,#fff); border:2px solid #f8ce7e; border-radius:20px; box-shadow:0 7px 0 #f1daaa; animation:pop .35s ease-out; }.winner .group { color:#0f969e; font-weight:800; font-size:.9rem; }.winner .name { margin-top:4px; font-size:1.65rem; font-weight:900; }.winner .seat { margin-top:3px; color:#6b838d; font-size:.85rem; }
    @keyframes pop { 0% { transform:scale(.65) rotate(-4deg); opacity:0; } 80% { transform:scale(1.05) rotate(1deg); } 100% { transform:scale(1); opacity:1; } }
    .bottom { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:16px; padding:15px 18px; }.status { font-weight:700; color:#4e737e; }.reset { color:#a14a35; border:2px solid #f2b6a8; background:#fff7f4; padding:8px 13px; border-radius:12px; font-weight:800; cursor:pointer; }.reset:hover { background:#ffe9e1; }
    .history { margin-top:20px; padding:18px; }.history h2 { margin:0 0 10px; font-size:1.05rem; }.history-list { display:flex; flex-wrap:wrap; gap:8px; }.pill { padding:7px 10px; border-radius:99px; background:#e5f8f1; color:#23705f; font-size:.9rem; font-weight:700; }.none { color:#78909a; }
    @media (max-width:680px) { header { align-items:flex-start; }.dog { transform:scale(.82); transform-origin:right top; }.modes { grid-template-columns:1fr; }.mode { min-height:76px; }.stage { padding:25px 12px; }.bottom { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>薩摩耶課堂隨機點名</h1><p class="subtitle">今天輪到誰？讓毛茸茸小幫手來決定！</p></div>
      <div class="dog" aria-hidden="true"><i class="ear left"></i><i class="ear right"></i><i class="face"></i><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="tongue"></i></div>
    </header>
    <section class="card modes" aria-label="點名模式">
      <button class="mode active" data-mode="students"><strong>🎲 隨機點學生</strong><small>從全班未抽過的同學中抽出指定人數</small></button>
      <button class="mode" data-mode="eachGroup"><strong>🐾 各組 1 人</strong><small>每一組各抽出一位尚未點過的同學</small></button>
      <button class="mode" data-mode="groupStudent"><strong>🦴 先組別、再學生</strong><small>先抽一組，再抽出該組的一位同學</small></button>
    </section>
    <section class="controls" aria-label="抽選控制">
      <label class="amount" id="amountControl">抽選人數 <input id="amount" type="number" min="1" value="1" aria-label="抽選人數"></label>
      <button class="draw" id="draw">開始抽選 ✨</button>
    </section>
    <section class="card stage" id="stage" aria-live="polite"><div class="empty"><span>🐶</span>選擇模式後，按下「開始抽選」</div></section>
    <section class="card bottom"><span class="status" id="status"></span><button class="reset" id="reset">↺ 重設本堂紀錄</button></section>
    <section class="card history"><h2>本堂已點名</h2><div id="history" class="history-list"><span class="none">尚未點名</span></div></section>
  </main>
  <script>
    const groups = [
      {name:'第一組',students:[['王小明','01'],['李小華','02'],['陳小美','03']]},
      {name:'第二組',students:[['林小安','04'],['張小晴','05'],['黃小宇','06']]},
      {name:'第三組',students:[['吳小杰','07'],['趙小芸','08'],['劉小倫','09']]}
    ];
    const key = 'samoyed-rollcall-20261027';
    let state = JSON.parse(localStorage.getItem(key) || '{"drawn":[],"history":[]}');
    let mode = 'students';
    let pendingGroup = null;
    const id = (group, name) => `${group}|${name}`;
    const all = groups.flatMap(g => g.students.map(([name,seat]) => ({group:g.name,name,seat,id:id(g.name,name)})));
    const shuffle = list => [...list].sort(() => Math.random() - .5);
    const save = () => localStorage.setItem(key, JSON.stringify(state));
    const available = () => all.filter(s => !state.drawn.includes(s.id));
    const card = s => `<article class="winner"><div class="group">${s.group}</div><div class="name">${s.name}</div><div class="seat">座號 ${s.seat}</div></article>`;
    function renderMeta() {
      const left = available().length;
      document.querySelector('#status').textContent = `尚有 ${left} 位同學未被點名`;
      const history = document.querySelector('#history');
      history.innerHTML = state.history.length ? state.history.map(s => `<span class="pill">${s.group}・${s.name}</span>`).join('') : '<span class="none">尚未點名</span>';
    }
    function show(message, winners=[]) {
      document.querySelector('#stage').innerHTML = winners.length ? `<div><div class="result-label">${message}</div><div class="result-list">${winners.map(card).join('')}</div></div>` : `<div class="empty"><span>🐾</span>${message}</div>`;
    }
    function commit(winners) { state.drawn.push(...winners.map(s=>s.id)); state.history.push(...winners); save(); renderMeta(); }
    function drawStudents() {
      const pool = available(); const n = Math.max(1, Number(document.querySelector('#amount').value) || 1);
      if (!pool.length) return show('全班都已經點過囉！可按「重設本堂紀錄」重新開始。');
      const winners = shuffle(pool).slice(0, Math.min(n,pool.length)); commit(winners); show(`薩摩耶選中了 ${winners.length} 位同學！`, winners);
    }
    function drawEachGroup() {
      const winners = groups.map(g => shuffle(available().filter(s=>s.group===g.name))[0]).filter(Boolean);
      if (!winners.length) return show('每一組都沒有尚未點過的同學囉！');
      commit(winners); show(`本輪由 ${winners.length} 組同學發言！`, winners);
    }
    function drawGroupStudent() {
      if (!pendingGroup) {
        const activeGroups = groups.filter(g=>available().some(s=>s.group===g.name));
        if (!activeGroups.length) return show('全班都已經點過囉！可按「重設本堂紀錄」重新開始。');
        pendingGroup = shuffle(activeGroups)[0];
        show(`第一步：抽到 ${pendingGroup.name}！請按「從此組抽學生」進行第二步。`);
        document.querySelector('#draw').textContent = '從此組抽學生 🐾';
        return;
      }
      const winner = shuffle(available().filter(s=>s.group===pendingGroup.name))[0];
      if (!winner) { pendingGroup = null; document.querySelector('#draw').textContent = '開始抽選 ✨'; return drawGroupStudent(); }
      const chosenGroup = pendingGroup.name;
      pendingGroup = null;
      commit([winner]);
      show(`第二步：從 ${chosenGroup} 抽出一位同學！`, [winner]);
      document.querySelector('#draw').textContent = '開始抽選 ✨';
    }
    document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active')); button.classList.add('active'); mode=button.dataset.mode; pendingGroup=null;
      document.querySelector('#draw').textContent = '開始抽選 ✨';
      document.querySelector('#amountControl').style.display = mode==='students' ? 'flex' : 'none';
    }));
    document.querySelector('#draw').addEventListener('click', () => ({students:drawStudents,eachGroup:drawEachGroup,groupStudent:drawGroupStudent})[mode]());
    document.querySelector('#reset').addEventListener('click', () => { if(confirm('要清除本堂所有已點名紀錄嗎？')) { state={drawn:[],history:[]}; pendingGroup=null; document.querySelector('#draw').textContent = '開始抽選 ✨'; save(); renderMeta(); show('紀錄已重設，可以重新開始點名！'); } });
    renderMeta();
  </script>
</body>
</html>
